<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | B Pradeep</title>
  <meta name="description" content="Page not found. Return to B Pradeep's portfolio." />
  <meta name="theme-color" content="#0A0B0D" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A0B0D'/><circle cx='16' cy='16' r='6' fill='%23FFB224'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0A0B0D;
      color: #ECEDEE;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #121418;
      border: 1px solid #1F232A;
      border-radius: 14px;
      padding: 48px 32px;
      max-width: 520px;
      width: 100%;
    }
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #FFB224;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 56px;
      font-weight: 400;
      color: #ECEDEE;
      margin-bottom: 16px;
    }
    p {
      color: #9BA1A6;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFB224;
      color: #0A0B0D;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">// ERROR 404</span>
