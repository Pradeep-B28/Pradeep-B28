name: Refresh 3D Contributions Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Graphs
        uses: yoshi389111/github-profile-3d-contrib@0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Deploy Generated Graph to Output Branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git branch -D output 2>/dev/null || true
          git checkout --orphan output
          git rm -rf .
          git checkout HEAD -- profile-3d-contrib
          git add profile-3d-contrib
          git commit -m "chore(stats): update automated 3d contribution graph [skip ci]" || exit 0
          git push -f origin output
