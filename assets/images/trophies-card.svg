<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glowTrophy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="url(#bgTrophy)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Trophy Grid (4 Cards) -->
  <!-- Trophy 1: Master Trainer -->
  <g transform="translate(30, 20)">
    <rect width="180" height="120" rx="12" fill="rgba(15,23,42,0.8)" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-size="28">🏆</text>
    <text x="90" y="68" text-anchor="middle" fill="#fbbf24" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">Master Trainer</text>
    <text x="90" y="88" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">6,000+ Students</text>
    <text x="90" y="104" text-anchor="middle" fill="#22d3ee" font-family="'Fira Code', monospace" font-size="10">Rank: A++</text>
  </g>

  <!-- Trophy 2: DSA Architect -->
  <g transform="translate(230, 20)">
    <rect width="180" height="120" rx="12" fill="rgba(15,23,42,0.8)" stroke="url(#cyanGrad)" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-size="28">⚡</text>
    <text x="90" y="68" text-anchor="middle" fill="#22d3ee" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">DSA Architect</text>
    <text x="90" y="88" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">1,000+ Problems</text>
    <text x="90" y="104" text-anchor="middle" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">Specialist</text>
  </g>

  <!-- Trophy 3: Java Core Specialist -->
  <g transform="translate(430, 20)">
    <rect width="180" height="120" rx="12" fill="rgba(15,23,42,0.8)" stroke="url(#purpleGrad)" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-size="28">☕</text>
    <text x="90" y="68" text-anchor="middle" fill="#a855f7" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">Java Specialist</text>
    <text x="90" y="88" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">JVM & Multithreading</text>
    <text x="90" y="104" text-anchor="middle" fill="#c084fc" font-family="'Fira Code', monospace" font-size="10">Core Mastery</text>
  </g>

  <!-- Trophy 4: Visualizer Creator -->
  <g transform="translate(630, 20)">
    <rect width="180" height="120" rx="12" fill="rgba(15,23,42,0.8)" stroke="url(#emeraldGrad)" stroke-width="1.5"/>
    <text x="90" y="38" text-anchor="middle" font-size="28">🎨</text>
    <text x="90" y="68" text-anchor="middle" fill="#10b981" font-family="'Outfit', sans-serif" font-weight="800" font-size="14">Tool Creator</text>
    <text x="90" y="88" text-anchor="middle" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Interactive 3D Sandbox</text>
    <text x="90" y="104" text-anchor="middle" fill="#34d399" font-family="'Fira Code', monospace" font-size="10">Pedagogy</text>
  </g>
</svg>
