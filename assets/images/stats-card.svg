<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <linearGradient id="bgStats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="dsaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="toolsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="url(#bgStats)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left Panel: GitHub & Mentorship Stats -->
  <g transform="translate(30, 24)">
    <text x="0" y="20" fill="#22d3ee" font-family="system-ui, sans-serif" font-weight="800" font-size="16">📊 Developer &amp; Mentorship Stats</text>
    
    <g transform="translate(0, 45)">
      <text x="0" y="15" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Primary Focus:</text>
      <text x="140" y="15" fill="#22d3ee" font-family="monospace" font-weight="700" font-size="13">Java &amp; DSA Training</text>

      <text x="0" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Learners Mentored:</text>
      <text x="140" y="45" fill="#10b981" font-family="monospace" font-weight="700" font-size="13">6,000+ Students</text>

      <text x="0" y="75" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Live DSA Sessions:</text>
      <text x="140" y="75" fill="#a855f7" font-family="monospace" font-weight="700" font-size="13">100+ Workshops</text>

      <text x="0" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">Satisfaction Rating:</text>
      <text x="140" y="105" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="13">99% Positive</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="410" y1="25" x2="410" y2="175" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Right Panel: Top Tech & Language Distribution -->
  <g transform="translate(440, 24)">
    <text x="0" y="20" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="800" font-size="16">⚡ Tech Stack Distribution</text>

    <!-- Java Progress Bar -->
    <g transform="translate(0, 42)">
      <text x="0" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Core Java &amp; Collections</text>
      <text x="350" y="12" text-anchor="end" fill="#ea580c" font-family="monospace" font-size="12">65%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="20" width="227.5" height="8" rx="4" fill="url(#javaGrad)"/>
    </g>

    <!-- DSA & Algorithms Progress Bar -->
    <g transform="translate(0, 84)">
      <text x="0" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Data Structures &amp; Algorithms</text>
      <text x="350" y="12" text-anchor="end" fill="#22d3ee" font-family="monospace" font-size="12">25%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="20" width="87.5" height="8" rx="4" fill="url(#dsaGrad)"/>
    </g>

    <!-- WebGL & Tooling Progress Bar -->
    <g transform="translate(0, 126)">
      <text x="0" y="12" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Git, Maven &amp; 3D Web Tools</text>
      <text x="350" y="12" text-anchor="end" fill="#a855f7" font-family="monospace" font-size="12">10%</text>
      <rect x="0" y="20" width="350" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="20" width="35" height="8" rx="4" fill="url(#toolsGrad)"/>
    </g>
  </g>
</svg>
