<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140">
  <defs>
    <linearGradient id="bgStreak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="16" fill="url(#bgStreak)" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(40, 24)">
    <!-- Column 1: Total Contributions -->
    <g transform="translate(60, 10)">
      <text x="70" y="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">TOTAL CONTRIBUTIONS</text>
      <text x="70" y="55" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-weight="900" font-size="28">1,280+</text>
      <text x="70" y="76" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">2024 - Present</text>
    </g>

    <line x1="270" y1="10" x2="270" y2="85" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Column 2: Continuous Streak -->
    <g transform="translate(320, 10)">
      <text x="70" y="20" text-anchor="middle" fill="#22d3ee" font-family="system-ui, sans-serif" font-weight="700" font-size="12">🔥 CURRENT STREAK</text>
      <text x="70" y="55" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="28">Active</text>
      <text x="70" y="76" text-anchor="middle" fill="#10b981" font-family="monospace" font-size="10">Consistent Updates ✓</text>
    </g>

    <line x1="530" y1="10" x2="530" y2="85" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Column 3: Impact & Velocity -->
    <g transform="translate(580, 10)">
      <text x="70" y="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">TEACHING VELOCITY</text>
      <text x="70" y="55" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-weight="900" font-size="28">High</text>
      <text x="70" y="76" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10">Active Code Repos</text>
    </g>
  </g>
</svg>
