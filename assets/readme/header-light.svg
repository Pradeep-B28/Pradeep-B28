<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <style>
      .bg { fill: #F8F9FA; }
      .card-border { stroke: #D0D7DE; stroke-width: 1.5; fill: #FFFFFF; rx: 14; }
      .name-text {
        font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
        font-size: 52px;
        font-weight: 400;
        fill: #1F2328;
        letter-spacing: -0.01em;
      }
      .title-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #B45309;
      }
      .oneliner-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14.5px;
        line-height: 22px;
        fill: #57606A;
      }
      .mono-pill {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        fill: #B45309;
      }
      .mono-stat {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #24292F;
      }
      .graph-edge {
        stroke: #D0D7DE;
        stroke-width: 1.2;
      }
      .path-edge {
        stroke: #B45309;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 8 4;
        animation: dash 4s linear infinite;
      }
      .graph-node {
        fill: #F6F8FA;
        stroke: #AFB8C1;
        stroke-width: 1.5;
      }
      .target-node {
        fill: #B45309;
        stroke: #FFFFFF;
        stroke-width: 2;
      }
      .pulse-dot {
        animation: pulse 2.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="#F8F9FA" stroke="#D0D7DE" stroke-width="1.5"/>

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.6">
    <line x1="60" y1="2" x2="60" y2="358" stroke="#EAECEF" stroke-width="1"/>
    <line x1="180" y1="2" x2="180" y2="358" stroke="#EAECEF" stroke-width="1"/>
    <line x1="300" y1="2" x2="300" y2="358" stroke="#EAECEF" stroke-width="1"/>
    <line x1="420" y1="2" x2="420" y2="358" stroke="#EAECEF" stroke-width="1"/>
    <line x1="540" y1="2" x2="540" y2="358" stroke="#EAECEF" stroke-width="1"/>
    <line x1="660" y1="2" x2="660" y2="358" stroke="#EAECEF" stroke-width="1"/>
    <line x1="2" y1="90" x2="1198" y2="90" stroke="#EAECEF" stroke-width="1"/>
    <line x1="2" y1="180" x2="1198" y2="180" stroke="#EAECEF" stroke-width="1"/>
    <line x1="2" y1="270" x2="1198" y2="270" stroke="#EAECEF" stroke-width="1"/>
  </g>

  <!-- Left Editorial Column -->
  <g transform="translate(60, 45)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#B45309">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="18" class="mono-pill">OPEN TO SDE ROLES · REMOTE / RELOCATION</text>

    <!-- Name -->
    <text x="0" y="88" class="name-text">B Pradeep</text>

    <!-- Title -->
    <text x="0" y="128" class="title-text">Software Engineer — Full-Stack &amp; Interactive Web</text>

    <!-- One-liner (2 lines) -->
    <text x="0" y="166" class="oneliner-text">I build full-stack platforms, developer tools, and interactive algorithm visualizations.</text>
    <text x="0" y="190" class="oneliner-text">4 years of engineering, 7,500+ engineers trained.</text>

    <!-- 3 Proof Stats in Mono -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="165" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="14" y="21" class="mono-stat">4 yrs engineering</text>

      <rect x="177" y="0" width="220" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="191" y="21" class="mono-stat">7,500+ engineers trained</text>

      <rect x="409" y="0" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="423" y="21" class="mono-stat">19 projects shipped</text>
    </g>
  </g>

  <!-- Right Side: Algorithmic Node Graph Scene (A* Shortest Path to Project) -->
  <g transform="translate(730, 45)">
    <!-- Graph Background Surface -->
    <rect x="0" y="0" width="410" height="270" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>

    <!-- A* Path Visualizer Tag -->
    <text x="20" y="30" class="mono-pill" fill="#57606A" font-size="10">A* PATHFINDING // SHORTEST PATH TO WORK</text>

    <!-- Graph Connections -->
    <g transform="translate(20, 20)">
      <!-- Inactive Edges -->
      <line x1="40" y1="180" x2="90" y2="100" class="graph-edge"/>
      <line x1="90" y1="100" x2="160" y2="50" class="graph-edge"/>
      <line x1="90" y1="100" x2="150" y2="130" class="graph-edge"/>
      <line x1="160" y1="50" x2="250" y2="40" class="graph-edge"/>
      <line x1="160" y1="50" x2="230" y2="110" class="graph-edge"/>
      <line x1="150" y1="130" x2="210" y2="190" class="graph-edge"/>
      <line x1="210" y1="190" x2="290" y2="180" class="graph-edge"/>
      <line x1="250" y1="40" x2="330" y2="80" class="graph-edge"/>
      <line x1="230" y1="110" x2="330" y2="80" class="graph-edge"/>
      <line x1="290" y1="180" x2="330" y2="140" class="graph-edge"/>

      <!-- Active A* Shortest Path (Cursor -> Project Node) -->
      <path d="M 40,180 L 150,130 L 230,110 L 330,80" class="path-edge">
        <animate attributeName="stroke-dashoffset" values="48;0" dur="2s" repeatCount="indefinite"/>
      </path>

      <!-- Junction Nodes -->
      <circle cx="90" cy="100" r="5" class="graph-node"/>
      <circle cx="160" cy="50" r="5" class="graph-node"/>
      <circle cx="250" cy="40" r="5" class="graph-node"/>
      <circle cx="210" cy="190" r="5" class="graph-node"/>
      <circle cx="290" cy="180" r="5" class="graph-node"/>
      <circle cx="330" cy="140" r="5" class="graph-node"/>

      <!-- Path Nodes -->
      <circle cx="40" cy="180" r="7" fill="#1F2328" stroke="#57606A" stroke-width="2"/>
      <text x="15" y="206" class="mono-pill" fill="#57606A" font-size="9">CURSOR</text>

      <circle cx="150" cy="130" r="6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="230" cy="110" r="6" fill="#B45309" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Target Node: Highlighted Project -->
      <circle cx="330" cy="80" r="10" class="target-node">
        <animate attributeName="r" values="9;12;9" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="270" y="60" class="mono-pill" fill="#B45309" font-size="10">PROJECT NODE</text>
    </g>
  </g>
</svg>
