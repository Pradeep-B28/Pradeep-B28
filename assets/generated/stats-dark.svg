<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <style>
      .label {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        fill: #8B949E;
      }
      .value {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 34px;
        font-weight: 700;
        fill: #E6EDF3;
      }
      .unit {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        fill: #8B949E;
      }
      .header-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        fill: #E3A03A;
      }
    </style>
  </defs>

  <rect width="1198" height="238" x="1" y="1" rx="14" fill="#0D1117" stroke="#2A313C" stroke-width="1.2"/>

  <!-- Top bar -->
  <g transform="translate(48, 36)">
    <circle cx="4" cy="4" r="4" fill="#E3A03A"/>
    <text x="18" y="8" class="header-title">ENGINEERING FOOTPRINT · VERIFIED GITHUB DATA</text>
  </g>

  <!-- 4 Data Columns -->
  <g transform="translate(48, 80)">
    <!-- Col 1: Public Projects -->
    <g transform="translate(0, 0)">
      <text x="0" y="20" class="label">PUBLIC REPOSITORIES</text>
      <text x="0" y="64" class="value">12</text>
      <text x="0" y="88" class="unit">Verified on GitHub</text>
    </g>

    <line x1="260" y1="10" x2="260" y2="105" stroke="#2A313C" stroke-width="1"/>

    <!-- Col 2: Total Contributions -->
    <g transform="translate(290, 0)">
      <text x="0" y="20" class="label">PAST YEAR CONTRIBUTIONS</text>
      <text x="0" y="64" class="value">223</text>
      <text x="0" y="88" class="unit">24 active commit days</text>
    </g>

    <line x1="560" y1="10" x2="560" y2="105" stroke="#2A313C" stroke-width="1"/>

    <!-- Col 3: Engineers Mentored -->
    <g transform="translate(590, 0)">
      <text x="0" y="20" class="label">ENGINEERS MENTORED</text>
      <text x="0" y="64" class="value">7,500+</text>
      <text x="0" y="88" class="unit">10+ intensive online bootcamps</text>
    </g>

    <line x1="860" y1="10" x2="860" y2="105" stroke="#2A313C" stroke-width="1"/>

    <!-- Col 4: Experience -->
    <g transform="translate(890, 0)">
      <text x="0" y="20" class="label">ENGINEERING EXPERIENCE</text>
      <text x="0" y="64" class="value">4 yrs</text>
      <text x="0" y="88" class="unit">Sethu Inst. of Tech &amp; VIT</text>
    </g>
  </g>
</svg>