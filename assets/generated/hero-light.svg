<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        font-style: normal;
        font-weight: 400;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .display-name {
        font-family: 'Instrument Serif', Georgia, serif;
        font-size: 54px;
        fill: #1B1F24;
        letter-spacing: -0.01em;
      }
      .subhead {
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 20px;
        font-weight: 600;
        fill: #59636E;
      }
      .details {
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        fill: #59636E;
      }
      .pill-text {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        fill: #059669;
      }
      .cta-text {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #9A5F0E;
      }
      .lattice-edge {
        stroke: #1F6B63;
        stroke-width: 1.2;
        stroke-opacity: 0.6;
      }
      .lattice-node {
        fill: #FAF8F4;
        stroke: #1F6B63;
        stroke-width: 1.8;
      }
      .accent-node {
        fill: #9A5F0E;
        stroke: #FFF;
        stroke-width: 1.5;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .pulse {
        animation: pulseDot 2.4s ease-in-out infinite;
        transform-origin: 75px 64px;
      }
      @media (prefers-reduced-motion: reduce) {
        .animated-mesh {
          animation: none !important;
        }
        .pulse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1198" height="358" x="1" y="1" rx="16" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>

  <!-- Left Content Column -->
  <g transform="translate(64, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#FAF8F4" stroke="#E4E0D8" stroke-width="1"/>
    <circle cx="15" cy="14" r="4.5" fill="#059669" class="pulse"/>
    <text x="30" y="18" class="pill-text">OPEN TO SDE ROLES · RELOCATING</text>

    <!-- Name in Instrument Serif -->
    <text x="0" y="90" class="display-name">B Pradeep</text>

    <!-- Headline -->
    <text x="0" y="134" class="subhead">Software Engineer · Full-Stack &amp; 3D Web</text>

    <!-- Subline -->
    <text x="0" y="166" class="details">4 years · 7,500+ engineers mentored · Open to remote or on-site roles worldwide</text>

    <!-- Interactive CTA Link to 3D Portfolio -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="270" height="38" rx="8" fill="#FFF8E7" stroke="#E6C98A" stroke-width="1"/>
      <text x="16" y="24" class="cta-text">Explore 3D Interactive Portfolio →</text>
    </g>
  </g>

  <!-- Right Visual Motif: The Algorithmic Lattice (Isometric 3D Polyhedral Graph) -->
  <g transform="translate(930, 180)">
    <g class="animated-mesh">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0 0 0" 
        to="360 0 0" 
        dur="10s" 
        repeatCount="indefinite" 
      />
      
      <!-- Outer Hexagonal Frame -->
      <line x1="-120" y1="0" x2="-60" y2="-90" class="lattice-edge"/>
      <line x1="-60" y1="-90" x2="60" y2="-90" class="lattice-edge"/>
      <line x1="60" y1="-90" x2="120" y2="0" class="lattice-edge"/>
      <line x1="120" y1="0" x2="60" y2="90" class="lattice-edge"/>
      <line x1="60" y1="90" x2="-60" y2="90" class="lattice-edge"/>
      <line x1="-60" y1="90" x2="-120" y2="0" class="lattice-edge"/>

      <!-- Inner Octahedral Star Connections -->
      <line x1="-120" y1="0" x2="0" y2="-40" class="lattice-edge"/>
      <line x1="120" y1="0" x2="0" y2="-40" class="lattice-edge"/>
      <line x1="-60" y1="-90" x2="0" y2="40" class="lattice-edge"/>
      <line x1="60" y1="-90" x2="0" y2="40" class="lattice-edge"/>
      <line x1="-60" y1="90" x2="0" y2="-40" class="lattice-edge"/>
      <line x1="60" y1="90" x2="0" y2="-40" class="lattice-edge"/>
      <line x1="0" y1="-40" x2="0" y2="40" stroke="#9A5F0E" stroke-width="1.8" stroke-dasharray="4,3"/>

      <!-- Cross Bracing -->
      <line x1="-60" y1="-90" x2="60" y2="90" class="lattice-edge" stroke-opacity="0.25"/>
      <line x1="60" y1="-90" x2="-60" y2="90" class="lattice-edge" stroke-opacity="0.25"/>

      <!-- Junction Nodes -->
      <circle cx="-120" cy="0" r="5" class="lattice-node"/>
      <circle cx="-60" cy="-90" r="5" class="lattice-node"/>
      <circle cx="60" cy="-90" r="5" class="lattice-node"/>
      <circle cx="120" cy="0" r="5" class="lattice-node"/>
      <circle cx="60" cy="90" r="5" class="lattice-node"/>
      <circle cx="-60" cy="90" r="5" class="lattice-node"/>
      
      <!-- Central Algorithmic Junction -->
      <circle cx="0" cy="-40" r="6" class="lattice-node" fill="#FAF8F4"/>
      <circle cx="0" cy="40" r="6" class="accent-node"/>
    </g>
  </g>
</svg>