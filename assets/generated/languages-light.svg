<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <style>
      .header-title {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        fill: #9A5F0E;
      }
      .lang-name {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #1B1F24;
      }
      .lang-pct {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        fill: #59636E;
      }
    </style>
  </defs>

  <rect width="1198" height="238" x="1" y="1" rx="14" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>

  <!-- Top bar -->
  <g transform="translate(60, 36)">
    <circle cx="4" cy="4" r="4" fill="#1F6B63"/>
    <text x="18" y="8" class="header-title">TOP LANGUAGES ACROSS PUBLIC CODEBASES</text>
  </g>

  <!-- Multi-segment bar -->
  <g transform="translate(60, 68)">
    <rect width="1080" height="10" rx="5" fill="#FAF8F4"/>
    <g>
      <rect x="0" y="0" width="622" height="10" rx="3" fill="#F7DF1E"/>
      <rect x="622" y="0" width="193" height="10" rx="3" fill="#3178C6"/>
      <rect x="815" y="0" width="139" height="10" rx="3" fill="#563D7C"/>
      <rect x="954" y="0" width="63" height="10" rx="3" fill="#E34F26"/>
      <rect x="1017" y="0" width="35" height="10" rx="3" fill="#B07219"/>
      <rect x="1052" y="0" width="25" height="10" rx="3" fill="#3572A5"/>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 115)">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#F7DF1E"/>
      <text x="20" y="10" class="lang-name">JavaScript</text>
      <text x="180" y="10" class="lang-pct">57.6%</text>
    </g>
    <g transform="translate(360, 0)">
      <circle cx="6" cy="6" r="5" fill="#3178C6"/>
      <text x="20" y="10" class="lang-name">TypeScript</text>
      <text x="180" y="10" class="lang-pct">17.9%</text>
    </g>
    <g transform="translate(720, 0)">
      <circle cx="6" cy="6" r="5" fill="#563D7C"/>
      <text x="20" y="10" class="lang-name">CSS</text>
      <text x="180" y="10" class="lang-pct">12.9%</text>
    </g>
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="5" fill="#E34F26"/>
      <text x="20" y="10" class="lang-name">HTML</text>
      <text x="180" y="10" class="lang-pct">5.8%</text>
    </g>
    <g transform="translate(360, 32)">
      <circle cx="6" cy="6" r="5" fill="#B07219"/>
      <text x="20" y="10" class="lang-name">Java</text>
      <text x="180" y="10" class="lang-pct">3.2%</text>
    </g>
    <g transform="translate(720, 32)">
      <circle cx="6" cy="6" r="5" fill="#3572A5"/>
      <text x="20" y="10" class="lang-name">Python</text>
      <text x="180" y="10" class="lang-pct">2.3%</text>
    </g>
  </g>
</svg>